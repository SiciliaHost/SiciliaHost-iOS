name: SiciliaHost
options:
  bundleIdPrefix: com.siciliahost
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: it
  createIntermediateGroups: true

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0

targets:
  SiciliaHost:
    type: application
    platform: iOS
    sources:
      - path: SiciliaHost
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseMessaging
      - package: GoogleSignIn
        product: GoogleSignIn
    # Schemi URL: `cactushost://invito/CODICE` / `siciliahost://invito/CODICE` e il ritorno del login Google
    info:
      path: Config/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.siciliahost.cactushost.invite
            CFBundleURLSchemes: [cactushost, siciliahost]
          - CFBundleURLName: com.google.signin
            CFBundleURLSchemes: ["$(GOOGLE_REVERSED_CLIENT_ID)"]
        UILaunchScreen: {}
        # F10: notifiche push in sfondo e giro dei calendari iCal (BGAppRefreshTask).
        UIBackgroundModes: [fetch, remote-notification]
        BGTaskSchedulerPermittedIdentifiers: [com.siciliahost.cactushost.icalsync]
    # Link universali degli inviti (https://siciliahost.com/invito/CODICE): richiedono anche il file
    # apple-app-site-association sul sito (repo Siciliahost.it) con l'ID dell'app (4D6QBBJVG5.com.siciliahost.cactushost).
    entitlements:
      path: Config/SiciliaHost.entitlements
      properties:
        keychain-access-groups:
          - 4D6QBBJVG5.com.siciliahost.cactushost
          - com.siciliahost.cactushost
        com.apple.developer.associated-domains: ["applinks:siciliahost.com"]
        com.apple.developer.applesignin: [Default]
        # Push (APNs): serve la capability "Push Notifications" sull'App ID e la chiave APNs caricata su Firebase.
        aps-environment: development
    scheme:
      testTargets:
        - SiciliaHostTests
    settings:
      base:
        DEVELOPMENT_TEAM: 4D6QBBJVG5
        PRODUCT_BUNDLE_IDENTIFIER: com.siciliahost.cactushost
        PRODUCT_NAME: CactusHost
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        GOOGLE_REVERSED_CLIENT_ID: com.googleusercontent.apps.246601493975-rvqjk8sbftn6s6f8sr901br1g0619p7b # da GoogleService-Info.plist
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1" # solo iPhone (iPad escluso per scelta)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: CactusHost
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: La fotocamera serve a scansionare documenti e codici a barre.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Il microfono serve a dettare i messaggi all'assistente.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Il riconoscimento vocale serve a trascrivere la tua voce per l'assistente.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.business

  SiciliaHostTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SiciliaHostTests
    dependencies:
      - target: SiciliaHost
    settings:
      base:
        DEVELOPMENT_TEAM: 4D6QBBJVG5
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"

name: SiciliaHost
options:
  bundleIdPrefix: com.siciliahost
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: it
  createIntermediateGroups: true

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0

targets:
  SiciliaHost:
    type: application
    platform: iOS
    sources:
      - path: SiciliaHost
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseMessaging
      - package: GoogleSignIn
        product: GoogleSignIn
    # Schemi URL: `siciliahost://invito/CODICE` e il ritorno del login Google (schema = REVERSED_CLIENT_ID di
    # GoogleService-Info.plist, da mettere in GOOGLE_REVERSED_CLIENT_ID quando l'app iOS è registrata in Firebase).
    info:
      path: Config/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.siciliahost.manager.invite
            CFBundleURLSchemes: [siciliahost]
          - CFBundleURLName: com.google.signin
            CFBundleURLSchemes: ["$(GOOGLE_REVERSED_CLIENT_ID)"]
        UILaunchScreen: {}
    # Link universali degli inviti (https://siciliahost.com/invito/CODICE): richiedono anche il file
    # apple-app-site-association sul sito (repo Siciliahost.it) e un account Apple Developer.
    entitlements:
      path: Config/SiciliaHost.entitlements
      properties:
        com.apple.developer.associated-domains: ["applinks:siciliahost.com"]
        com.apple.developer.applesignin: [Default]
    scheme:
      testTargets:
        - SiciliaHostTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.siciliahost.manager # PROVVISORIO: vedi DIARIO.md
        PRODUCT_NAME: SiciliaHost
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        GOOGLE_REVERSED_CLIENT_ID: com.googleusercontent.apps.246601493975-rvqjk8sbftn6s6f8sr901br1g0619p7b # da GoogleService-Info.plist
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1" # solo iPhone (iPad escluso per scelta)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: SiciliaHost Manager
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: La fotocamera serve a scansionare documenti e codici a barre.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.business

  SiciliaHostTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SiciliaHostTests
    dependencies:
      - target: SiciliaHost
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
